<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Road to Barcelona</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f7f4ef;
  color: #222;
}

.wrap {
  max-width: 1000px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 22px;
  box-shadow: 0 5px 22px rgba(0,0,0,.08);
  overflow: hidden;
}

header {
  padding: 22px 22px 14px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(25px, 6vw, 42px);
  letter-spacing: .3px;
}

.sub {
  margin-top: 5px;
  color: #666;
  font-size: 18px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 16px 16px;
}

.stat {
  background: #f1eee8;
  border-radius: 16px;
  padding: 14px;
  text-align: center;
}

.num {
  font-size: clamp(24px, 7vw, 38px);
  font-weight: 800;
}

.label {
  font-size: 13px;
  color: #666;
}

.intro {
  padding: 0 0 14px;
}

.intro-title {
  font-weight: 800;
  font-size: 21px;
  margin: 18px 0 6px;
}

.intro-text {
  margin: 0;
  font-size: 18px;
  line-height: 1.35;
}

#map {
  height: 58vh;
  min-height: 390px;
  width: 100%;
}

.progress {
  padding: 16px 28px 20px;
}

.bar {
  height: 15px;
  background: #e4e0d8;
  border-radius: 99px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: #f5b400;
  border-radius: 99px;
  transition: width .4s;
}

.foot {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #666;
  margin-top: 8px;
}

details {
  margin: 14px 0 0;
}

summary {
  cursor: pointer;
  font-weight: 700;
}

.admin {
  padding: 14px;
  background: #faf8f4;
  border-radius: 14px;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 18px;
  margin: 8px 0;
}

button {
  padding: 11px 16px;
  border: 0;
  border-radius: 10px;
  background: #06152f;
  color: #fff;
  font-weight: 700;
}

.hint {
  font-size: 12px;
  color: #777;
  margin-top: 8px;
}

/* SMALL FOOTBALL MARKERS */

.club-marker {
  background: transparent;
  border: none;
}

.club-pin {
  width: 32px;
  height: 32px;
  background: #06152f;
  border: 3px solid #f5b400;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 5px rgba(0,0,0,.3);
}

.club-pin span {
  transform: rotate(45deg);
  font-size: 14px;
  line-height: 1;
}

/* BUS */

.bus-icon {
  background: transparent;
  border: none;
}

.bus-emoji {
  font-size: 29px;
  line-height: 35px;
  text-align: center;
  width: 35px;
  height: 35px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <header>
      <h1>🚌 Road to Barcelona</h1>
      <div class="sub">Livingston → Barcelona · 2,200 km</div>
    </header>

    <div class="stats">

      <div class="stat">
        <div class="num" id="raised">£0</div>
        <div class="label">RAISED</div>
      </div>

      <div class="stat">
        <div class="num" id="km">0 km</div>
        <div class="label">COMPLETED</div>
      </div>

    </div>

  </div>

  <div class="intro">

    <div class="intro-title">
      One club. One journey. One goal. ⚽
    </div>

    <p class="intro-text">
      Every donation, big or small, gets the boys one step closer to Barcelona.
    </p>

  </div>

  <div id="map"></div>

  <div class="progress">

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>

    <div class="foot">
      <span id="percent">0%</span>
      <span id="remaining">2,200 km to Barcelona</span>
    </div>

  </div>

    <div class="admin">

        Current amount raised (£)
